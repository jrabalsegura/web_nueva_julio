# Solo instalación inicial. Certbot añade TLS a la copia instalada.
# Mantener separado para añadir www sin sobrescribir el site HTTPS existente.
server {
    listen 80;
    listen [::]:80;
    server_name www.resolutionsolarenergy.es;

    return 308 https://resolutionsolarenergy.es$request_uri;
}
