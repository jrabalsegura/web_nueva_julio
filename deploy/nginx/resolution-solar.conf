# Solo instalación inicial: Certbot añade TLS a la copia instalada.
# No sobrescribir esa copia con esta plantilla al actualizar la aplicación.
server {
    listen 80;
    listen [::]:80;
    server_name julio.joserabalsegura.com resolutionsolarenergy.es;

    access_log /var/log/nginx/resolution-solar.access.log;
    error_log /var/log/nginx/resolution-solar.error.log warn;
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:3089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx es el único proxy público; descartar cabeceras aportadas por clientes.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
